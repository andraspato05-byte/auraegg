name: CI

# Runs every check on each push and pull request, and attaches the built place file.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rojo, selene and Lune
        run: tools/install_tools.sh

      - name: Generate, lint, API check, build and test
        run: tools/check.sh --ci

      - name: Upload the place file
        uses: actions/upload-artifact@v4
        with:
          name: StealTheAuraEgg-place
          path: StealTheAuraEgg.rbxlx
